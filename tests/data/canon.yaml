meta:
  schema_version: 1
  start_location: loc_shelter
  tone: "мрачное фэнтези"

initial_state:
  flags:
    door_unlocked: false
    escaped: false
    unset_flag: false

flags:
  door_unlocked: {type: bool, description: "Дверь открыта"}
  escaped: {type: bool, description: "Побег совершён"}
  unset_flag: {type: bool, description: "Объявлен, но нигде не устанавливается"}

locations:
  - id: loc_shelter
    name: Убежище
    scene: "Тесное убежище с земляным полом."
    entities: [item_key]
    exits:
      - {to: loc_market, direction: north}

  - id: loc_market
    name: Рынок
    scene: "Шумный рынок под открытым небом."
    entities: [npc_trader, npc_wounded, item_sword]
    exits:
      - {to: loc_shelter, direction: south}
      - to: loc_escape
        direction: east
        condition:
          - {type: flag, flag: door_unlocked, equals: true}
        effects:
          - {type: set_flag, flag: escaped, value: true}

  - id: loc_escape
    name: Свобода
    scene: "Открытая местность за стенами."
    entities: []
    exits: []

npcs:
  - id: npc_trader
    name: Торговец
    aliases: [торговец, trader]
  - id: npc_wounded
    name: Раненый
    aliases: [раненый, wounded]

items:
  - id: item_key
    name: Ключ
    aliases: [ключ, key]
  - id: item_sword
    name: Меч
    aliases: [меч, sword]

use_targets:
  - id: ut_door
    name: Дверь
    aliases: [дверь, door]
    exit:
      location: loc_market
      direction: east
    use:
      - target: item_key
        effects:
          - {type: set_flag, flag: door_unlocked, value: true}

verbs:
  - id: LOOK
    aliases: [look, осмотреться, смотреть]
  - id: GO
    aliases: [go, идти, пойти]
    args: [direction]
  - id: TAKE
    aliases: [take, взять, подобрать]
    args: [item]
  - id: USE
    aliases: [use, использовать, применить]
    args: [item, target]
  - id: TALK
    aliases: [talk, говорить, поговорить]
    args: [npc]
    optional_args: [topic]
  - id: SAY
    aliases: [say, сказать]
    args: [topic]

directions:
  - {id: north, name: Север, aliases: [north, север]}
  - {id: south, name: Юг, aliases: [south, юг]}
  - {id: east, name: Восток, aliases: [east, восток]}

reason_codes: [ok, unknown, denied, not_applicable]

win_condition:
  - {type: flag, flag: escaped, equals: true}