[project]
name = "anvil-and-ink"
version = "0.1.0"
description = "Text adventure with hard engine + soft narrator (Level 1)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]
llm = ["httpx>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["anvil_and_ink*"]