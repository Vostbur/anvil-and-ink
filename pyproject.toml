[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-and-ink"
version = "0.1.0"
description = "Text adventure with hard engine + soft narrator (Level 1)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["anvil_and_ink*"]