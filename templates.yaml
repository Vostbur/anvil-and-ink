# ============================================================
# TEMPLATES v1. Fallback-тексты. Загружается вместе с canon.
# Загрузчик фатален при неполноте (каждый reason_code имеет generic).
# ============================================================

# Пары (verb, reason_code), для которых текст гарантированно
# приходит из Outcome.response_text. Специфичный шаблон для них
# не требуется (тест D-TPL-3 их пропускает).
canon_guarantee:
  - {verb: TALK, reason_code: ok}
  - {verb: USE,  reason_code: ok}

# Общие шаблоны. Обязательны для каждого кода из reason_codes.
# Слотов не содержат (см. спецификацию рендерера).
generic:
  ok:
    - "Вы делаете это."
    - "Действие выполнено."
  no_exit:
    - "Туда пройти нельзя."
    - "Такого выхода нет."
  locked:
    - "Заперто."
    - "Путь закрыт."
  no_item_here:
    - "Здесь такого нет."
    - "Этого здесь не видно."
  not_takeable:
    - "Это нельзя взять."
    - "Предмет не поддаётся."
  not_in_inventory:
    - "У вас этого нет."
    - "Этого нет в вашем инвентаре."
  no_npc_here:
    - "Здесь не с кем говорить."
    - "Такого собеседника здесь нет."
  no_topic:
    - "Собеседник не отвечает на это."
    - "На эту тему он молчит."
  condition_not_met:
    - "Условие не выполнено."
    - "Пока это невозможно."
  no_target:
    - "Такой цели нет."
    - "Применить не к чему."
  target_not_here:
    - "Цель находится в другом месте."
    - "Применить отсюда нельзя."
  invalid_combination:
    - "Так это применить нельзя."
    - "Это не сочетается."
  unknown:
    - "Не понимаю. Попробуйте иначе."
    - "Не разобрал команду."
    - "Не понял. Скажите по-другому."

# Специфичные шаблоны. Могут содержать слоты; если слот нельзя
# заполнить (arg = null) — шаблон пропускается, берётся generic.
specific:
  GO:
    ok:
      - "Вы идёте на {direction}."
      - "Вы направляетесь на {direction}."
      - "Вы приходите на {direction}."
    no_exit:
      - "На {direction} пройти нельзя."
      - "Туда — на {direction} — пути нет."
    locked:
      - "На {direction} — заперто."
      - "Дверь на {direction} заперта."
  LOOK:
    ok:
      - "Вы оглядываетесь. {scene}"
      - "Вы осматриваетесь. {scene}"
      - "Вы обводите взглядом помещение. {scene}"
  TAKE:
    ok:
      - "Вы берёте {item}."
      - "{item} теперь у вас."
      - "Вы подбираете {item}."
    no_item_here:
      - "{item} здесь нет."
      - "Здесь не видно {item}."
  DROP:
    ok:
      - "Вы оставляете {item} здесь."
      - "{item} остаётся здесь."
  TALK:
    no_npc_here:
      - "{npc} здесь нет."
      - "Здесь не видно {npc}."
    no_topic:
      - "{npc} не хочет об этом говорить."
  USE:
    no_npc_here:
      - "{npc} не здесь."
    invalid_combination:
      - "{item} здесь не поможет."
      - "Так {item} применить нельзя."
    no_target:
      - "Нет такой цели."
    target_not_here:
      - "{target} находится в другом месте."
      - "Применить отсюда к {target} нельзя."